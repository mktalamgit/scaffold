services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scaffold
      POSTGRES_USER: scaffold
      POSTGRES_PASSWORD: scaffold
    ports:
      - "5432:5432"
    volumes:
      - scaffold-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scaffold -d scaffold"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scaffold-postgres:
